[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "0.1.0"
description = "Agente de IA que faz a triagem de denúncias de golpe em pedidos de delivery, com checagem por código e aprovação humana."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.51", "pandas>=2.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fraudguard = "fraudguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraudguard = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Textos dos cenários: uma frase por linha é mais legível que quebrar o português.
"data/generate_cases.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fraudguard"]
known-local-folder = ["conftest", "test_signals", "generate_cases"]
