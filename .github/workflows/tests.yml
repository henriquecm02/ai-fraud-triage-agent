name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: pytest -q
      - run: python bench/run_benchmark.py --so-baseline --saida /tmp/bench
      - run: python bench/run_benchmark.py --so-baseline --casos data/cases_ruidosos.jsonl --gabarito data/ground_truth_ruidosos.json --saida /tmp/bench
      - run: python bench/run_benchmark.py --so-baseline --casos data/cases_ruidosos.jsonl --gabarito data/ground_truth_ruidosos.json --saida /tmp/bench
